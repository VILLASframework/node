# yaml-language-server: $schema=http://json-schema.org/draft-07/schema
# SPDX-FileCopyrightText: 2014-2026 Institute for Automation of Complex Power Systems, RWTH Aachen University
# SPDX-License-Identifier: Apache-2.0
---
type: object
required: [type, offset]
additionalProperties: false
properties:
  type:
    type: string
    const: shift_ts

  mode:
    type: string
    enum:
    - origin
    - received
    description: The timestamp field which should be adjusted by the `offset` setting.

  offset:
    type: number
    description: The offset in seconds which is added to the timestamp field of each processed sample.

  priority:
    default: 99
    $ref: ./shared-hook-priority.yaml
