---
title: tsv
type: object
required: [type]
additionalProperties: false
properties:
  type:
    type: string
    const: tsv

  separator:
    default: "\t"
    $ref: ./shared-format-column-separator.yaml

  delimiter:
    default: "\n"
    $ref: ./shared-format-line-delimiter.yaml

  comment_prefix:
    default: "#"
    $ref: ./shared-format-line-comment_prefix.yaml

  header:
    default: true
    $ref: ./shared-format-line-header.yaml

  skip_first_line:
    default: false
    $ref: ./shared-format-line-skip_first_line.yaml

  real_precision:
    default: 17
    $ref: ./shared-format-real_precision.yaml

  ts_origin:
    default: true
    $ref: ./shared-format-ts_origin.yaml

  ts_received:
    default: false
    $ref: ./shared-format-ts_received.yaml

  sequence:
    default: true
    $ref: ./shared-format-sequence.yaml

  data:
    default: true
    $ref: ./shared-format-data.yaml

  offset:
    default: true
    $ref: ./shared-format-offset.yaml
