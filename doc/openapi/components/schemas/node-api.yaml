---
type: object
required: [type]
properties:
  type:
    type: string
    const: api

  in:
    default: {}
    type: object
    properties:
      enabled:
        default: true
        $ref: ./shared-node-enabled.yaml

      builtin:
        default: true
        $ref: ./shared-node-builtin.yaml

      vectorize:
        default: 1
        $ref: ./shared-node-vectorize.yaml

      hooks:
        default: []
        $ref: shared-hook-list.yaml

      signals:
        type: array
        items:
          $ref: "#/definitions/node-api-signal"

    additionalProperties: false

  out:
    default: {}
    type: object
    properties:
      enabled:
        default: true
        $ref: ./shared-node-enabled.yaml

      netem:
        $ref: ./shared-node-netem.yaml

      fwmark:
        $ref: ./shared-node-fwmark.yaml

      builtin:
        default: true
        $ref: ./shared-node-builtin.yaml

      vectorize:
        default: 1
        $ref: ./shared-node-vectorize.yaml

      hooks:
        default: []
        $ref: shared-hook-list.yaml

      signals:
        type: array
        items:
          $ref: "#/definitions/node-api-signal"

    additionalProperties: false
additionalProperties: false

definitions:
  node-api-signal:
    type: object
    properties:
      description:
        type: string
        description: A human readable description of the channel.

      payload:
        description: |
          Describes the type of information which is exchanged over the channel.
        type: string
        enum:
        - events
        - samples

      range:
        oneOf:
        - type: object
          description: Limits for numeric datatypes
          properties:
            min:
              type: number
            max:
              type: number

          additionalProperties: false

        - type: array
          description: A list of allowed string values for string datatype
          items:
            type: string

      rate:
        type: number
        description: |
          Expected refresh-rate in Hertz of this channel
          Does not apply channels which have event payloads.

      name:
        $ref: ./shared-signal-name.yaml

      unit:
        $ref: ./shared-signal-unit.yaml

      type:
        $ref: ./shared-signal-type.yaml

      init:
        $ref: ./shared-signal-init.yaml

      enabled:
        $ref: ./shared-signal-enabled.yaml

    additionalProperties: false
