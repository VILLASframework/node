---
type: object
required: [type, signals, polar_to_rect, angle]
additionalProperties: false
properties:
  type:
    type: string
    const: complex

  polar_to_rect:
    type: boolean
    default: false
    description: Flag converts polar to rect coordinates if true, rect to polar coordinates if false.

  signals:
    $ref: ./shared-hook-signals.yaml

  angle:
    type: string
    default: deg

