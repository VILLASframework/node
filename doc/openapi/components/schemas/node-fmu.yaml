---
title: FMU node-type
type: object
required: [type, fmu_path, fmu_unpack_path, fmu_writing_turn, start_time, stop_time, step_size]
properties:
  type:
    type: string
    const: fmu

  fmu_path:
    type: string
    description: |
      Specifies the URI to a FMU model

  fmu_unpack_path:
    type: string
    description: |
      Specifies the URI to a directory which has the unpacked files of the FMU model (mainly the shared library and the modelDescription.xml for the model).

  fmu_writing_turn:
    type: boolean
    description: |
      Specifies whether the model has to be written with input values before running. `true` denotes that the model should use the input values. `false` would make the model use default values instead.

  start_time:
    type: number
    description: |
      Specifies the start time for the simulation. Value has to be at least one `step_size` lesser than `stop_time`.

  stop_time:
    type: number
    description: |
      Specifies the stop time for the simulation. The number of steps is calculated then by the difference between `start_time` and `stop_time` divided by the `step_size`.

  step_size:
    type: number
    description: |
      Specifies the step size for the simulation. Special care has to be taken to ensure that the value is equal to the value mantioned in modelDescription.xml.

  in:
    type: object
    properties:
      enabled:
        default: true
        $ref: ./shared-node-enabled.yaml

      builtin:
        default: true
        $ref: ./shared-node-builtin.yaml

      vectorize:
        default: 1
        $ref: ./shared-node-vectorize.yaml

      hooks:
        default: []
        $ref: ./shared-hook-list.yaml

      signals:
        $ref: ./shared-signal-list.yaml

  out:
    type: object
    properties:
      enabled:
        default: true
        $ref: ./shared-node-enabled.yaml

      netem:
        $ref: ./shared-node-netem.yaml

      fwmark:
        $ref: ./shared-node-fwmark.yaml

      builtin:
        default: true
        $ref: ./shared-node-builtin.yaml

      vectorize:
        default: 1
        $ref: ./shared-node-vectorize.yaml

      hooks:
        default: []
        $ref: ./shared-hook-list.yaml

      signals:
        $ref: ./shared-signal-list.yaml

  additionalProperties: false

additionalProperties: false
