---
type: object
required: [type]
additionalProperties: false
properties:
  type:
    type: string
    const: ma

  window_size:
    type: integer
    description: The size of the window (number of samples) which should be used for the moving average filter.
    example: 100
    default: 0
    minimum: 0

  priority:
    default: 99
    $ref: ./shared-hook-priority.yaml

  signal:
    $ref: ./shared-hook-signal.yaml

  signals:
    $ref: ./shared-hook-signals.yaml

oneOf:
- required: [signals]
- required: [signal]
