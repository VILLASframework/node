---
title: Floating Point Decimal Precision
type: integer
minimum: 0
maximum: 31
description: |
  Output all real numbers with at most n digits of precision.
  A precision of 17 is sufficient to correctly and losslessly encode all IEEE 754 double precision floating point numbers.
