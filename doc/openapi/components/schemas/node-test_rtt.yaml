---
title: Round-trip Time Test
type: object
required: [type, cases]
properties:
  type:
    type: string
    const: test_rtt

  format:
    default: villas.human
    $ref: ./format.yaml

  prefix:
    type: string
    description: A prefix which is prepended to the output file name of the RTT test result file.
    example: "test_1"

  output:
    type: string
    default: "."
    description: A directory path at which the RTT test result files be placed.

  shutdown:
    type: boolean
    description: If set, the node will shut down VILLASnode after all test cases have finished.

  cooldown:
    type: number
    default: 0.0
    description: |
      A default cool-down time between consecutive test cases.
      The node will insert a pause between the tests to avoid any network effects of the previous test-case to influence the upcoming test-case.

  warmup:
    type: number
    default: 0.0
    description: |
      A default warm-up time in seconds before the measurement of each test-case is started.

  rates:
    description: |
      The default list of sending rates in Hz used by test-cases which do not specify their own `rates`.
    oneOf:
    - type: number
    - type: array
      items:
        type: number

  values:
    description: |
      The default list of sample lengths used by test-cases which do not specify their own `values`.
    oneOf:
    - type: integer
    - type: array
      items:
        type: integer

  count:
    type: integer
    default: 1000
    description: |
      The default number of samples used by test-cases which do not specify their own `count`.

  duration:
    type: number
    default: 300.0
    description: |
      The default duration in seconds used by test-cases which do not specify their own `duration`.

  mode:
    type: string
    enum:
    - min
    - max
    - at_least_count
    - at_least_duration
    - stop_after_count
    - stop_after_duration
    description: The default mode used by test-cases which do not specify their own `mode`.

  cases:
    type: array
    description: |
      A list of test-case specifications.

      The values from the `rates` and `values` settings of each test-case specification will be used to form a cross-product.
    items:
      type: object
      properties:
        rates:
          description: |
            A list of sending rates in Hz.
            The resulting test-case will generate samples at the given rate.
          example:
          - 10
          - 100
          - 1000
          - 10000
          oneOf:
          - type: number
          - type: array
            items:
              type: number

        values:
          description: |
            A list of sample length.
            The resulting test-case will generate samples with the given number of signals.
          example:
          - 10
          - 100
          oneOf:
          - type: integer
          - type: array
            items:
              type: integer

        count:
          description: |
            The resulting test-case will send the number of samples specified by this setting.
            This setting is exclusive with the `duration` setting.
          type: integer
          example: 10000

        duration:
          description: |
            The resulting test-case will be stopped after the configured duration in seconds.
            This setting is exclusive with the `count` setting.
          type: number
          example: 60.0

        mode:
          type: string
          enum:
          - min
          - max
          - at_least_count
          - at_least_duration
          - stop_after_count
          - stop_after_duration

      additionalProperties: false

  in:
    $ref: ./shared-node-in.yaml

  out:
    $ref: ./shared-node-out.yaml

additionalProperties: false
