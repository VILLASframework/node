---
type: object
required: [type, offset]
additionalProperties: false
properties:
  type:
    type: string
    const: shift_seq

  offset:
    type: integer
    description: The offset which is added to the sequence number of each processed sample.

  priority:
    default: 99
    $ref: ./shared-hook-priority.yaml
