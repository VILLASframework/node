---
type: object
required: [type]
additionalProperties: false
properties:
  type:
    type: string
    const: reorder_ts

  window_size:
    type: integer
    default: 16
    minimum: 1
    description: The number of samples buffered for reordering.

  priority:
    default: 2
    $ref: ./shared-hook-priority.yaml
