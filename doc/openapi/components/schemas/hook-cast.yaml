# SPDX-FileCopyrightText: 2014-2023 Institute for Automation of Complex Power Systems, RWTH Aachen University
# SPDX-License-Identifier: Apache-2.0
---
type: object
required: [type]
additionalProperties: false
properties:
  type:
    type: string
    const: cast

  new_type:
    type: string
    enum:
    - integer
    - float
    - boolean
    - complex
    description: The type of the casted signal.
    example: integer

  new_name:
    type: string
    description: The new name of the casted signal.
    example: BusA.V

  new_unit:
    type: string
    description: The new unit of the casted signal.
    example: V

  priority:
    default: 99
    $ref: ./shared-hook-priority.yaml

  signal:
    $ref: ./shared-hook-signal.yaml

  signals:
    $ref: ./shared-hook-signals.yaml

oneOf:
- required: [signals]
- required: [signal]
