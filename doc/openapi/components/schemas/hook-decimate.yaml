# yaml-language-server: $schema=http://json-schema.org/draft-07/schema
# SPDX-FileCopyrightText: 2014-2023 Institute for Automation of Complex Power Systems, RWTH Aachen University
# SPDX-License-Identifier: Apache-2.0
---
type: object
required: [type, ratio]
additionalProperties: false
properties:
  type:
    type: string
    const: decimate

  ratio:
    type: integer
    description: The decimation ratio. A value of 4 will skip every, but the 4th sample in a row.
    example: 4

  renumber:
    type: boolean
    default: false
    description: Renumber the sequence numbers of the output samples starting from zero.

  priority:
    default: 99
    $ref: ./shared-hook-priority.yaml
