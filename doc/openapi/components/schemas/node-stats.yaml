---
title: Statistics
type: object
required: [type, rate, in]
properties:
  type:
    type: string
    const: stats

  rate:
    type: number
    description: A rate in Hz at which the statistics are generated by this node.

  in:
    type: object
    required:
    - signals
    properties:
      enabled:
        default: true
        $ref: ./shared-node-enabled.yaml

      builtin:
        default: true
        $ref: ./shared-node-builtin.yaml

      vectorize:
        default: 1
        $ref: ./shared-node-vectorize.yaml

      hooks:
        default: []
        $ref: ./shared-hook-list.yaml

      signals:
        type: array
        items:
          $ref: "#/definitions/node-stats-signal"

    additionalProperties: false

  out:
    $ref: ./shared-node-out.yaml

additionalProperties: false

definitions:
  node-stats-signal:
    type: object
    required:
    - stats
    properties:
      stats:
        type: string
        description: |
          The statistic to expose as a signal, given as `<node>.<metric>.<type>`
          (for example `node1.owd.mean`).

      name:
        $ref: ./shared-signal-name.yaml

      unit:
        $ref: ./shared-signal-unit.yaml

      type:
        $ref: ./shared-signal-type.yaml

      init:
        $ref: ./shared-signal-init.yaml

      enabled:
        $ref: ./shared-signal-enabled.yaml
    additionalProperties: false
