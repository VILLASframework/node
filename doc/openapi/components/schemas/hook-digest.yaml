---
type: object
required: [type, uri, algorithm]
additionalProperties: false
properties:
  type:
    type: string
    const: digest

  uri:
    description: The output file for digests.
    example: digest.txt
    type: string

  algorithm:
    description: The algorithm used for calculating digests.
    example: sha256
    type: string

  mode:
    description: The file open mode passed to fopen (e.g. "w" to truncate, "a" to append).
    example: w
    type: string

  priority:
    default: 999
    $ref: ./shared-hook-priority.yaml
