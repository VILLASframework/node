---
type: object
required: [type, interval]
properties:
  type:
    type: string
    const: frame

  trigger:
    description: The trigger for new frames.
    type: string
    default: timestamp
    enum:
    - sequence
    - timestamp

  interval:
    description: The interval in which frames are annotated.
    default: "1s"
    not:
      const: null

  priority:
    default: 10
    $ref: ./shared-hook-priority.yaml

additionalProperties: false

oneOf:
- required: [trigger]
  properties:
    trigger:
      const: sequence
    interval:
      type: integer
  additionalProperties: {}
- properties:
    trigger:
      const: timestamp
    interval:
      $ref: ./shared-duration.yaml
  additionalProperties: {}
