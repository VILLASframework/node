---
title: Interface to OpenDSS, EPRI's Distribution System Simulator
type: object
required: [type, in, out]
properties:
  type:
    type: string
    const: opendss

  file_path:
    type: string
    description: |
      Specifies the URI to a OpenDSS file.

  in:
    type: object
    required: [list]
    properties:
      enabled:
        default: true
        $ref: ./shared-node-enabled.yaml

      builtin:
        default: true
        $ref: ./shared-node-builtin.yaml

      vectorize:
        default: 1
        $ref: ./shared-node-vectorize.yaml

      hooks:
        default: []
        $ref: ./shared-hook-list.yaml

      signals:
        $ref: ./shared-signal-list.yaml

      list:
        type: array
        items:
          type: object
          required: [name, type, data]
          properties:
            name:
              type: string
              description: |
                Name of the element.

            type:
              type: string
              description: |
                Type of the element.

            data:
              type: array
              description: |
                Data to be input. Possible options depend on the element type.
              items:
                type: string

          oneOf:
          - title: Load or generator
            properties:
              type:
                type: string
                enum: [load, generator]
              data:
                type: array
                items:
                  enum: [kV, kW, kVar, Pf]

            additionalProperties: true

          - title: Current source
            properties:
              type:
                type: string
                const: isource
              data:
                type: array
                items:
                  enum: [Amps, AngleDeg, Frequency]

            additionalProperties: true
          additionalProperties: false

    additionalProperties: false

  out:
    type: object
    required: [list]
    properties:
      enabled:
        default: true
        $ref: ./shared-node-enabled.yaml

      builtin:
        default: true
        $ref: ./shared-node-builtin.yaml

      vectorize:
        default: 1
        $ref: ./shared-node-vectorize.yaml

      hooks:
        default: []
        $ref: ./shared-hook-list.yaml

      signals:
        $ref: ./shared-signal-list.yaml

      netem:
        $ref: ./shared-node-netem.yaml

      fwmark:
        $ref: ./shared-node-fwmark.yaml

      list:
        description: |
          Names of the monitors to be read.
        type: array
        items:
          type: string

    additionalProperties: false

additionalProperties: false
