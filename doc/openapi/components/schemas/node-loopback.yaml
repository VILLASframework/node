---
title: Loopback
type: object
required: [type]
properties:
  type:
    type: string
    const: loopback

  queuelen:
    type: integer
    minimum: 0
    description: The queue length of the internal queue which buffers the samples.

  mode:
    type: string
    enum:
    - pthread
    - polling
    - eventfd
    - auto
    default: auto
    description: Specify the synchronization mode of the internal queue.

  in:
    $ref: ./shared-node-in.yaml

  out:
    $ref: ./shared-node-out.yaml

additionalProperties: false
