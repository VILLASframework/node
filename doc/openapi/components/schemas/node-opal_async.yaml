---
title: OPAL-RT Asynchronous Process
type: object
required: [type, id]
properties:
  type:
    type: string
    const: opal.async

  id:
    description: The Send/Recv ID of the RT-Lab OpAsyncSend/Recv blocks.
    minimum: 1
    default: 1
    type: integer

  in:
    type: object
    properties:
      enabled:
        default: true
        $ref: ./shared-node-enabled.yaml

      builtin:
        default: true
        $ref: ./shared-node-builtin.yaml

      vectorize:
        default: 1
        $ref: ./shared-node-vectorize.yaml

      hooks:
        default: []
        $ref: ./shared-hook-list.yaml

      signals:
        $ref: ./shared-signal-list.yaml

      reply:
        description: Send a confirmation to the Simulink model that signals have been received and processed.
        default: false
        type: boolean

    additionalProperties: false

  out:
    type: object
    properties:
      enabled:
        default: true
        $ref: ./shared-node-enabled.yaml

      netem:
        $ref: ./shared-node-netem.yaml

      fwmark:
        $ref: ./shared-node-fwmark.yaml

      builtin:
        default: true
        $ref: ./shared-node-builtin.yaml

      vectorize:
        default: 1
        $ref: ./shared-node-vectorize.yaml

      hooks:
        default: []
        $ref: ./shared-hook-list.yaml

      signals:
        $ref: ./shared-signal-list.yaml

    additionalProperties: false

additionalProperties: false
