---
type: object
required: [type]
additionalProperties: false
properties:
  type:
    type: string
    const: gtnet

  bits:
    default: 32
    $ref: ./shared-format-raw-bits.yaml

  endianess:
    default: "big"
    $ref: ./shared-format-raw-endianess.yaml

  fake:
    default: false
    $ref: ./shared-format-raw-fake.yaml

  real_precision:
    default: 17
    $ref: ./shared-format-real_precision.yaml

  ts_origin:
    default: false
    $ref: ./shared-format-ts_origin.yaml

  ts_received:
    default: false
    $ref: ./shared-format-ts_received.yaml

  sequence:
    default: false
    $ref: ./shared-format-sequence.yaml

  data:
    default: true
    $ref: ./shared-format-data.yaml

  offset:
    default: false
    $ref: ./shared-format-offset.yaml
