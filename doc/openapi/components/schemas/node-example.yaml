---
title: Example Node
type: object
required: [type]
properties:
  type:
    type: string
    const: example

  setting1:
    type: integer
    minimum: 0    # Make sure any constraints of the values are checked by ExampleNode::check().
    maximum: 100
    default: 72 # Make sure the default values match ExampleNode::ExampleNode().
    description: A first setting

  setting2:
    type: string
    minimum: 0
    maximum: 10
    default: something
    description: Another setting

  in:
    $ref: ./shared-node-in.yaml

  out:
    $ref: ./shared-node-out.yaml

additionalProperties: false
