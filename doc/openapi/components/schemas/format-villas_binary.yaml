# yaml-language-server: $schema=http://json-schema.org/draft-07/schema
# SPDX-FileCopyrightText: 2014-2023 Institute for Automation of Complex Power Systems, RWTH Aachen University
# SPDX-License-Identifier: Apache-2.0
---
type: object
required: [type]
additionalProperties: false
properties:
  type:
    type: string
    const: villas.binary

  source_index:
    default: 0
    $ref: ./shared-format-villas-source_index.yaml

  validate_source_index:
    default: false
    $ref: ./shared-format-villas-validate_source_index.yaml

  real_precision:
    default: 17
    $ref: ./shared-format-real_precision.yaml

  ts_origin:
    default: true
    $ref: ./shared-format-ts_origin.yaml

  ts_received:
    default: false
    $ref: ./shared-format-ts_received.yaml

  sequence:
    default: true
    $ref: ./shared-format-sequence.yaml

  data:
    default: true
    $ref: ./shared-format-data.yaml

  offset:
    default: false
    $ref: ./shared-format-offset.yaml
