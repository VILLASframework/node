---
type: object
required: [type]
additionalProperties: false
properties:
  type:
    type: string
    const: scale

  offset:
    type: number
    default: 0.0
    example: 100.5
    description: The offset which is added to the signal after gain.

  scale:
    type: number
    default: 1.0
    example: 1e3
    description: The factor by which the signal is multiplied before the offset is added.

  priority:
    default: 99
    $ref: ./shared-hook-priority.yaml

  signal:
    $ref: ./shared-hook-signal.yaml

  signals:
    $ref: ./shared-hook-signals.yaml

oneOf:
- required: [signals]
- required: [signal]
