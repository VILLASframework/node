# SPDX-License-Identifier: Apache-2.0
---
type: object
required: [type]
additionalProperties: false
properties:
  type:
    type: string
    const: print

  output:
    type: string
    default: "/dev/stdout"
    description: An optional path to a file to which the samples processed by this hook will be written to.

  format:
    default: "villas.human"
    $ref: ./format.yaml

  prefix:
    type: string
    default: ""
    description: An optional prefix which will be prepended to each line written by this hook to the output

  priority:
    default: 99
    $ref: ./shared-hook-priority.yaml
