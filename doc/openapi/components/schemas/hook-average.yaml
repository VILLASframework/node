---
type: object
required: [type, offset]
additionalProperties: false
properties:
  type:
    type: string
    const: average

  offset:
    type: integer
    description: |
      The signal offset at which the average signal should be inserted.

      **Examples:**
      - `0` inserts the averaged signal before all other signals in the sample
      - `1` inserts the averaged signal after the first signal.

  priority:
    default: 99
    $ref: ./shared-hook-priority.yaml

  signal:
    $ref: ./shared-hook-signal.yaml

  signals:
    $ref: ./shared-hook-signals.yaml

oneOf:
- required: [signals]
- required: [signal]
