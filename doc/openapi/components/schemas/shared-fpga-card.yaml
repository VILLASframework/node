---
description: FPGA Card configuration
type: object
required: [interface]
properties:
  interface:
    type: string
    enum: [pcie, platform]
  name:
    type: string
  ips:
    type: string
  affinity:
    type: integer
  do_reset:
    type: boolean
  slot:
    type: string
  id:
    type: string
  polling:
    type: boolean
  paths:
    type: array
    items:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
        reverse:
          type: boolean
      additionalProperties: false
  ignore_ips:
    type: array
    items:
      type: string
additionalProperties: false
