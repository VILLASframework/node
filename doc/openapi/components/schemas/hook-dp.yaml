# SPDX-License-Identifier: Apache-2.0
---
type: object
required: [type, f0, harmonics, signal]
additionalProperties: false
properties:
  type:
    type: string
    const: dp

  f0:
    description: The fundamental frequency.
    example: 50
    type: number

  dt:
    description: The timestep of the input samples. Exclusive with `rate` setting.
    examples: [50e-6]
    type: number

  rate:
    description: The rate of the input samples. Exclusive with `dt` setting.
    type: number

  harmonics:
    type: array
    minItems: 1
    description: A list of selected harmonics which should be calculated.
    example: [0, 1, 3, 5 ]
    items:
      type: integer

  inverse:
    description: Enable the calucation of the inverse transform.
    type: boolean
    default: false

  priority:
    default: 99
    $ref: ./shared-hook-priority.yaml

  signal:
    description: The name or index of a signal to which this hook should be applied
    oneOf:
    - $ref: ./shared-hook-signal.yaml
    - type: integer

oneOf:
- required: [dt]
- required: [rate]
