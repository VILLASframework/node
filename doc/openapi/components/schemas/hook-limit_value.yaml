---
type: object
required: [type, min, max]
additionalProperties: false
properties:
  type:
    type: string
    const: limit_value

  min:
    description: The smallest value which will pass through the hook before getting clipped.
    type: number

  max:
    description: The largest value which will pass through the hook before getting clipped.
    type: number

  priority:
    default: 99
    $ref: ./shared-hook-priority.yaml

  signal:
    $ref: ./shared-hook-signal.yaml

  signals:
    $ref: ./shared-hook-signals.yaml

oneOf:
- required: [signals]
- required: [signal]
