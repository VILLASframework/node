# Only run hooks for the pre-commit stage unless specified otherwise
default_stages: [pre-commit]

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# commitlint runs at commit-msg, so plain `pre-commit install` must wire that stage too.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.patch$|^paper\.md$
      - id: end-of-file-fixer
        exclude: \.(svg|patch)$
      - id: check-ast
      - id: check-xml
      - id: check-yaml
      - id: check-json
        # devcontainer.json contains comments
        exclude: .devcontainer/devcontainer\.json
      - id: check-toml
      - id: check-added-large-files
        exclude: ^paper\.md$
      - id: pretty-format-json
        # ruff-format has its own mind of formatting Jupyter notebooks
        exclude: \.ipynb$|^.devcontainer/devcontainer\.json$|package-lock\.json$
        args:
          - --no-sort-keys
          - --autofix

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v17.0.6"
    hooks:
      - id: clang-format
        files: \.(c|cpp|h|hpp)(\.in)?$
        args: []

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "2.7.3"
    hooks:
      - id: editorconfig-checker
        alias: ec
        args:
        - -disable-indent-size
        - -exclude
        - ^LICENSE$|^LICENSES/|\.ecf$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.10"
    hooks:
      - id: ruff
        exclude: .*_pb2.pyi?$
        args: [--fix]
      - id: ruff-format
        exclude: .*_pb2.pyi?$

  - repo: https://github.com/markdownlint/markdownlint
    rev: "v0.13.0"
    hooks:
      - id: markdownlint
        exclude: ^paper\.md$|^CHANGELOG\.md$
        args: [-r, "~MD013,~MD033,~MD024"]

  - repo: https://github.com/fsfe/reuse-tool
    rev: "v6.2.0"
    hooks:
      - id: reuse-lint-file

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: "v9.26.0"
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@19.8.1"]

  - repo: local
    hooks:
      - id: dco-hook
        name: check DCO
        entry: ./tools/pre-commit-dco-hook.sh
        language: script
        stages: [prepare-commit-msg]
