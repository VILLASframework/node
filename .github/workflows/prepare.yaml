name: Prepare

on:
  workflow_call:
    inputs:
      docker_image:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: ${{ inputs.docker_image }}
  DOCKER_TAG: ${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  prepare-docker:
    name: "Prepare Docker Dev Images [${{ matrix.name }}]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            docker_file: packaging/docker/Dockerfile.ubuntu
            image_name: ubuntu
          - name: debian
            docker_file: packaging/docker/Dockerfile.debian
            image_name: debian
          - name: rocky
            docker_file: packaging/docker/Dockerfile.rocky
            image_name: rocky
          - name: rocky9
            docker_file: packaging/docker/Dockerfile.rocky9
            image_name: rocky9
          - name: fedora
            docker_file: packaging/docker/Dockerfile.fedora
            image_name: fedora
          - name: fedora-minimal
            docker_file: packaging/docker/Dockerfile.fedora-minimal
            image_name: fedora-minimal
          - name: fedora-vscode
            docker_file: packaging/docker/Dockerfile.fedora
            image_name: vscode
            target: dev-vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Compute safe ref Tag
        id: ref
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.docker_file }}
          target: ${{ matrix.target || 'dev' }}
          push: true
          cache-from: type=gha,scope=dev-${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.image_name }}
          tags: |
            ${{ env.DOCKER_IMAGE }}/dev-${{ matrix.image_name }}:${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_IMAGE }}/dev-${{ matrix.image_name }}:${{ steps.ref.outputs.tag }}

      - name: Publish fedora dev alias
        if: matrix.name == 'fedora'
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}/dev:${{ env.DOCKER_TAG }}" \
            -t "${{ env.DOCKER_IMAGE }}/dev:${{ steps.ref.outputs.tag }}" \
            "${{ env.DOCKER_IMAGE }}/dev-fedora:${{ env.DOCKER_TAG }}"
