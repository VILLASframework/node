name: Prepare

on:
  workflow_call:
    inputs:
      container_image:
        required: true
        type: string
      ref:
        required: true
        type: string
      ref_name:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  container:
    name: "Prepare Container Dev Images [${{ matrix.name }}]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            docker_file: packaging/docker/Dockerfile.ubuntu
            image_name: ubuntu
          - name: debian
            docker_file: packaging/docker/Dockerfile.debian
            image_name: debian
          - name: rocky
            docker_file: packaging/docker/Dockerfile.rocky
            image_name: rocky
          - name: rocky9
            docker_file: packaging/docker/Dockerfile.rocky9
            image_name: rocky9
          - name: fedora
            docker_file: packaging/docker/Dockerfile.fedora
            image_name: fedora
          - name: fedora-minimal
            docker_file: packaging/docker/Dockerfile.fedora-minimal
            image_name: fedora-minimal
          - name: fedora-vscode
            docker_file: packaging/docker/Dockerfile.fedora
            image_name: vscode
            target: dev-vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: true
          fetch-depth: 0
          submodules: recursive

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.docker_file }}
          target: ${{ matrix.target || 'dev' }}
          push: true
          cache-from: type=gha,scope=dev-${{ matrix.image_name }}
          cache-to: ${{ github.event_name != 'pull_request_target' && format('type=gha,mode=max,scope=dev-{0}', matrix.image_name) || '' }}
          tags: |
            ${{ inputs.container_image }}/dev-${{ matrix.image_name }}:${{ inputs.ref }}
            ${{ inputs.container_image }}/dev-${{ matrix.image_name }}:${{ steps.ref.outputs.tag }}

      - name: Publish fedora dev alias
        if: matrix.name == 'fedora'
        run: |
          docker buildx imagetools create \
            -t "${{ inputs.container_image }}/dev:${{ inputs.ref }}" \
            -t "${{ inputs.container_image }}/dev:${{ steps.ref.outputs.tag }}" \
            "${{ inputs.container_image }}/dev-fedora:${{ inputs.ref }}"
