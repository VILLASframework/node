name: Deploy

on:
  workflow_call:
    inputs:
      docker_image:
        required: true
        type: string
      ref:
        required: true
        type: string
      ref_name:
        required: true
        type: string
      is_version_tag:
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: ${{ inputs.docker_image }}

permissions:
  contents: read
  packages: write

jobs:
  deploy-docker:
    name: Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}" \
            "${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-x86_64" \
            "${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-arm64"

  deploy-docker-dev:
    name: Docker Dev Images
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Publish dev image for current ref
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}/dev:${{ steps.ref.outputs.tag }}" \
            "${{ env.DOCKER_IMAGE }}/dev-fedora:${{ steps.ref.outputs.tag }}"

  deploy-docker-dev-vscode:
    name: Docker Dev VSCode Images
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Publish dev-vscode image for current ref
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}/dev-vscode:${{ steps.ref.outputs.tag }}" \
            "${{ env.DOCKER_IMAGE }}/dev-vscode:${{ inputs.ref }}"

  latest-docker:
    name: Docker Images as latest
    if: ${{ inputs.is_version_tag }}
    needs: [deploy-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Tag and Push Image as latest
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}:latest" \
            "${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-x86_64" \
            "${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-arm64"

  latest-docker-dev:
    name: Docker Dev Images as latest
    if: ${{ inputs.is_version_tag }}
    needs: [deploy-docker-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Tag and push dev image as latest
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}/dev:latest" \
            "${{ env.DOCKER_IMAGE }}/dev:${{ steps.ref.outputs.tag }}"
