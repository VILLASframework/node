name: Deploy

on:
  workflow_call:
    inputs:
      container_image:
        required: true
        type: string
      ref:
        required: true
        type: string
      ref_name:
        required: true
        type: string
      is_version_tag:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  container:
    name: Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ inputs.container_image }}:${{ steps.ref.outputs.tag }}" \
            "${{ inputs.container_image }}:${{ steps.ref.outputs.tag }}-x86_64" \
            "${{ inputs.container_image }}:${{ steps.ref.outputs.tag }}-arm64"

  container-dev:
    name: Container Dev Images
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Publish dev image for current ref
        run: |
          docker buildx imagetools create \
            -t "${{ inputs.container_image }}/dev:${{ steps.ref.outputs.tag }}" \
            "${{ inputs.container_image }}/dev-fedora:${{ steps.ref.outputs.tag }}"

  container-dev-vscode:
    name: Container Dev VSCode Images
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Publish dev-vscode image for current ref
        run: |
          docker buildx imagetools create \
            -t "${{ inputs.container_image }}/dev-vscode:${{ steps.ref.outputs.tag }}" \
            "${{ inputs.container_image }}/dev-vscode:${{ inputs.ref }}"

  latest-container:
    name: Container Images as latest
    if: ${{ inputs.is_version_tag }}
    needs: [container]
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Tag and Push Image as latest
        run: |
          docker buildx imagetools create \
            -t "${{ inputs.container_image }}:latest" \
            "${{ inputs.container_image }}:${{ steps.ref.outputs.tag }}-x86_64" \
            "${{ inputs.container_image }}:${{ steps.ref.outputs.tag }}-arm64"

  latest-container-dev:
    name: Container Dev Images as latest
    if: ${{ inputs.is_version_tag }}
    needs: [container-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Tag and push dev image as latest
        run: |
          docker buildx imagetools create \
            -t "${{ inputs.container_image }}/dev:latest" \
            "${{ inputs.container_image }}/dev:${{ steps.ref.outputs.tag }}"
