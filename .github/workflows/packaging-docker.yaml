name: Packaging (Docker)

on:
  workflow_call:
    inputs:
      docker_image:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: ${{ inputs.docker_image }}
  CMAKE_EXTRA_OPTS: -DCMAKE_BUILD_TYPE=Release
  DOCKER_FILE: packaging/docker/Dockerfile.debian

permissions:
  contents: read
  packages: write

jobs:
  pkg-docker-x86_64:
    name: "Docker [x86_64]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute safe ref Tag
        id: ref
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKER_FILE }}
          target: app
          push: true
          pull: true
          platforms: amd64
          cache-from: |
            type=gha,scope=dev-debian
            type=gha,scope=app-x86_64
          cache-to: type=gha,mode=max,scope=app-x86_64
          build-args: |
            ARCH=x86_64
            TRIPLET=x86_64-linux-gnu
            CMAKE_OPTS=${{ env.CMAKE_EXTRA_OPTS }}
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-x86_64

  pkg-docker-arm64:
    name: "Docker [arm64]"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute safe ref Tag
        id: ref
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile.debian
          target: app
          push: true
          pull: true
          platforms: linux/arm64
          cache-from: type=gha,scope=app-arm64
          cache-to: type=gha,mode=max,scope=app-arm64
          build-args: |
            ARCH=arm64
            TRIPLET=aarch64-linux-gnu
            CMAKE_OPTS=${{ env.CMAKE_EXTRA_OPTS }}
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-arm64
