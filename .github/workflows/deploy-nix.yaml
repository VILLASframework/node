name: Deploy (Nix)

on:
  workflow_call:
    inputs:
      docker_image:
        required: true
        type: string
      ref_name:
        required: true
        type: string
      is_version_tag:
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: ${{ inputs.docker_image }}

permissions:
  contents: read
  packages: write

jobs:
  deploy-docker-nix:
    name: Nix-based Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Multi-arch Nix Manifest
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-nix" \
            "${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-nix-x86_64-linux" \
            "${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-nix-aarch64-linux"

  latest-docker-nix:
    name: Tag Nix-based Docker Images as latest-nix
    if: ${{ inputs.is_version_tag }}
    needs: [deploy-docker-nix]
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute safe ref Tag
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Tag Nix Manifest as latest-nix
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_IMAGE }}:latest-nix" \
            "${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-nix"

  release-nix:
    name: Release Nix
    if: ${{ inputs.is_version_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: villas-*
          path: dist
          merge-multiple: true

      - name: Publish ARX and RPM Bundles to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
