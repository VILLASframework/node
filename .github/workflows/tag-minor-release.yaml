name: Tag Minor Release

on:
    workflow_call: {}

jobs:
    tag-minor-release:
        name: Tag Next Minor Version
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Determine and create next minor tag
              id: next_tag
              run: |
                  set -euo pipefail

                  git fetch --tags --force

                  latest_tag=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)

                  if [[ -z "${latest_tag}" ]]; then
                    next_tag="v0.1.0"
                  else
                    version="${latest_tag#v}"
                    major="${version%%.*}"
                    rest="${version#*.}"
                    minor="${rest%%.*}"
                    next_tag="v${major}.$((minor + 1)).0"
                  fi

                  if git rev-parse "${next_tag}" >/dev/null 2>&1; then
                    echo "Tag ${next_tag} already exists. Skipping creation."
                    echo "created=false" >> "$GITHUB_OUTPUT"
                    echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git tag -a "${next_tag}" -m "Release ${next_tag}"
                  git push origin "${next_tag}"

                  echo "created=true" >> "$GITHUB_OUTPUT"
                  echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"

            - name: Report created tag
              run: |
                  if [[ "${{ steps.next_tag.outputs.created }}" == "true" ]]; then
                    echo "Created and pushed tag: ${{ steps.next_tag.outputs.tag }}"
                  else
                    echo "No new tag created. Existing tag: ${{ steps.next_tag.outputs.tag }}"
                  fi
